name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Base path and public URL come from the Pages configuration:
      #   <user>.github.io/<repo>  -> base path "/<repo>"
      #   custom domain or <user>.github.io repo -> base path ""
      # Override either with repository variables (Settings → Secrets and variables → Actions → Variables).
      NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve base path and site URL
        run: |
          echo "NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-${{ steps.pages.outputs.base_path }}}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-${{ steps.pages.outputs.base_url }}}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Lint, type-check and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build static export
        run: npm run build

      - name: End-to-end tests against the exported site
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
