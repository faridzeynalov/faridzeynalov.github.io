<!doctype html>
<!--
  faridzeynalov.github.io has moved to faridzeynalov.com. GitHub Pages serves this file for the
  home page and (as 404.html) for every other path; it sends visitors, and search engines, to
  the same page on the new domain. Deployed by .github/workflows/ci.yml.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farid Zeynalov — moved to faridzeynalov.com</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://faridzeynalov.com/" />
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "") || "/";
        location.replace("https://faridzeynalov.com" + path + location.search + location.hash);
      })();
    </script>
    <!-- Without JavaScript: the home page. -->
    <meta http-equiv="refresh" content="0; url=https://faridzeynalov.com/" />
    <style>
      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #0a0a0c;
        color: #ededef;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      a {
        color: #ff8a5b;
      }
    </style>
  </head>
  <body>
    <p>This site has moved to <a href="https://faridzeynalov.com/">faridzeynalov.com</a>.</p>
  </body>
</html>
